# Opens a pull request when a pinned tool releases a new version. The verify workflow runs on each one and shows
# whether the skill still works with it. After merging, run `node run.mjs --record` in verify/ and commit the
# updated "Verified against" line in README.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/verify"
    schedule:
      interval: monthly
    groups:
      playwright-toolchain:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (peer range <6.1.0), so a grouped update that includes it
      # cannot be resolved and blocks every other bump. Remove when a typescript-eslint release accepts TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: "/verify"
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
