# Verifies the playwright-e2e skill (skills/playwright-e2e) with verify/run.mjs against the pinned tool versions.
name: Verify playwright-e2e skill

on:
  schedule:
    - cron: "17 6 1 * *" # monthly, 06:17 UTC on the 1st
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/playwright-e2e/**"
      - "verify/**"
      - ".github/workflows/verify-skill.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verify/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install -r requirements.txt

      - name: Verify templates, enforcement and hook
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: node run.mjs

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: |
            verify/test-results
            verify/playwright-report
          if-no-files-found: ignore
